# Push-to-deploy: SSHes into the VPS and runs scripts/deploy.sh.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   VPS_HOST  — server IP or hostname
#   VPS_USER  — SSH user that owns /srv/kaduna and is in the docker group
#   VPS_SSH_KEY — private key whose public half is in that user's authorized_keys
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy script over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /srv/kaduna/scripts/deploy.sh main
