# Canonical host: Supabase sessions live in per-origin localStorage, so a user
# signed in on www would look signed out on the apex. Redirect www to apex.
server {
    listen 80;
    listen [::]:80;
    server_name www.kaduna.lk;
    return 301 https://kaduna.lk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Immutable hashed build assets
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next static export emits /dashboard.html for /dashboard
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
