[project]
name = "kaduna-geo-intelligence"
dynamic = ["version"]
description = "Kaduna.lk — Geo-Intelligence component (impact scoring service)"
authors = [{ name = "Asath M M", email = "it22633422@my.sliit.lk" }]
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyJWT[crypto]>=2.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.scripts]
geo-intelligence = "src.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]
