openapi: 3.1.0
info:
  title: Kaduna.lk — Auth Service
  version: 1.0.0
  description: >-
    Authentication, user, and vehicle management for Kaduna.lk. Issues and rotates
    JWT access/refresh token pairs and owns the per-user vehicle garage. Supersedes
    the legacy vehicle-service. Hand-authored contract (Express service, no auto-spec).
servers:
  - url: http://localhost:3002
    description: Local development
tags:
  - name: auth
    description: Registration, login, token lifecycle, current user
  - name: vehicles
    description: Per-user vehicle garage (all routes require bearerAuth)
  - name: admin
    description: Operations-only user listing
  - name: health
    description: Liveness / readiness
paths:
  /health:
    get:
      tags: [health]
      summary: Health check (verifies DB connectivity)
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          service: { type: string, example: auth-service }
                          status: { type: string, example: healthy }
                          version: { type: string, example: "1.0.0" }
                          uptime: { type: number }
                          database: { type: string, example: connected }
        "503":
          description: Database connection failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/auth/register:
    post:
      tags: [auth]
      summary: Self-register a driver or provider account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                phone: { type: string, nullable: true }
                role:
                  type: string
                  description: Only "driver" or "provider" honored; anything else defaults to "driver".
                  enum: [driver, provider]
      responses:
        "201":
          description: Account created; returns user and a fresh token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "400":
          description: Missing required field
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: Email already registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated; returns user and a fresh token pair
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AuthSession" }
        "400":
          description: Missing email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair issued (old refresh token revoked)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TokenPair" }
        "400":
          description: refreshToken missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Invalid, revoked, or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: "#/components/schemas/User" }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: User not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token (logout)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          revoked: { type: boolean, example: true }
        "400":
          description: refreshToken missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/vehicles:
    get:
      tags: [vehicles]
      summary: List the authenticated user's vehicles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vehicles (default first, then oldest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicles:
                            type: array
                            items: { $ref: "#/components/schemas/Vehicle" }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    post:
      tags: [vehicles]
      summary: Add a vehicle to the garage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "201":
          description: Vehicle created (first vehicle is auto-defaulted)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicle: { $ref: "#/components/schemas/Vehicle" }
        "400":
          description: make, model and plateNumber are required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    put:
      tags: [vehicles]
      summary: Update a vehicle (partial; unset fields keep current values)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicle: { $ref: "#/components/schemas/Vehicle" }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    delete:
      tags: [vehicles]
      summary: Delete a vehicle (next vehicle becomes default if needed)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          deleted: { type: boolean, example: true }
                          id: { type: string }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/vehicles/{id}/set-default:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    post:
      tags: [vehicles]
      summary: Mark a vehicle as the user's default
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vehicle is now default
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          vehicle: { $ref: "#/components/schemas/Vehicle" }
        "401":
          description: Missing/invalid/expired token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: List all users (requires the "ops" role)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users (oldest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: "#/components/schemas/User" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Insufficient role (not "ops")
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /api/auth/login, /register, or /refresh.
  parameters:
    VehicleId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Vehicle ID
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, timestamp]
      properties:
        success: { type: boolean, example: true }
        data: {}
        error: { type: "null" }
        timestamp: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      required: [success, error, timestamp]
      properties:
        success: { type: boolean, example: false }
        data: { type: "null" }
        error: { type: string, description: Human-readable error message }
        timestamp: { type: string, format: date-time }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
      description: Token-pair shape issued by issueTokenPair/rotateRefreshToken.
    User:
      type: object
      description: User record without passwordHash (safeUser).
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string, nullable: true }
        role: { type: string, example: driver }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AuthSession:
      type: object
      description: User plus a token pair (register/login response data).
      properties:
        user: { $ref: "#/components/schemas/User" }
        accessToken: { type: string }
        refreshToken: { type: string }
    VehicleInput:
      type: object
      required: [make, model, plateNumber]
      properties:
        nickname: { type: string, nullable: true }
        make: { type: string }
        model: { type: string }
        year: { type: integer, nullable: true }
        plateNumber: { type: string }
        color: { type: string, nullable: true }
        currentMileage: { type: integer, default: 0 }
        fuelType: { type: string, default: petrol }
        isDefault: { type: boolean }
    Vehicle:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        nickname: { type: string, nullable: true }
        make: { type: string }
        model: { type: string }
        year: { type: integer, nullable: true }
        plateNumber: { type: string }
        color: { type: string, nullable: true }
        currentMileage: { type: integer }
        fuelType: { type: string }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
