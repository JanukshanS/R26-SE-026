  /api/v1/my/garages/{id}/book:
    post:
      operationId: bookGarage
      tags:
        - owners
      summary: Book a slot for one of your cars
      description: The plate must be one the caller registered (403 otherwise), so the visit shows in their dashboard. Same slot rules and limits as the public booking link.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startsAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  description: Must be one of the slots offered
                service:
                  type: string
                  minLength: 1
                  maxLength: 160
                plate:
                  type: string
                  minLength: 1
                  maxLength: 20
                  description: One of the caller's registered vehicles; the visit then shows in their dashboard
                vehicle:
                  description: Make and model, e.g. Toyota Aqua
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: "null"
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                phone:
                  type: string
                  minLength: 7
                  maxLength: 40
                notes:
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: "null"
              required:
                - startsAt
                - service
                - plate
                - name
                - phone
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: For /book?a=… to view or cancel
                      booking:
                        $ref: "#/components/schemas/PublicBooking"
                    required:
                      - token
                      - booking
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed (for example, a dispatch job assigned to another provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, stock too low, duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/garages/{garageId}/staff:
    get:
      operationId: internalListStaff
      tags:
        - internal
      summary: A garage's mechanics, with their Kaduna accounts
      security:
        - internalToken: []
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Everyone on the staff list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        phone:
                          type:
                            - string
                            - "null"
                        active:
                          type: boolean
                        userId:
                          type:
                            - string
                            - "null"
                          description: null until they join with their invite code
                      required:
                        - id
                        - name
                        - phone
                        - active
                        - userId
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or wrong X-Internal-Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/garages/{garageId}/job-cards/{jobId}:
    get:
      operationId: internalGetJob
      tags:
        - internal
      summary: A job card, briefly
      security:
        - internalToken: []
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      number:
                        type: integer
                      status:
                        enum:
                          - OPEN
                          - IN_PROGRESS
                          - WAITING_PARTS
                          - READY
                          - CLOSED
                          - CANCELLED
                      editable:
                        type: boolean
                        description: "Can take new lines: not finished, not invoiced"
                      vehicle:
                        oneOf:
                          - type: object
                            properties:
                              plate:
                                type:
                                  - string
                                  - "null"
                              make:
                                type:
                                  - string
                                  - "null"
                              model:
                                type:
                                  - string
                                  - "null"
                              year:
                                type:
                                  - integer
                                  - "null"
                            required:
                              - plate
                              - make
                              - model
                              - year
                          - type: "null"
                    required:
                      - id
                      - number
                      - status
                      - editable
                      - vehicle
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or wrong X-Internal-Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/garages/{garageId}/job-cards/{jobId}/notes:
    post:
      operationId: internalAddJobNote
      tags:
        - internal
      summary: A private note on the job timeline
      security:
        - internalToken: []
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
              required:
                - note
      responses:
        "200":
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      added:
                        const: true
                    required:
                      - added
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or wrong X-Internal-Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /internal/v1/garages/{garageId}/job-cards/{jobId}/parts:
    post:
      operationId: internalAddJobParts
      tags:
        - internal
      summary: Put received parts on the job
      description: Adds PART lines at the price paid when the job can still take lines; the note goes on the timeline either way.
      security:
        - internalToken: []
      parameters:
        - name: garageId
          in: path
          required: true
          schema:
            type: string
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lines:
                  minItems: 1
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      description:
                        type: string
                        minLength: 1
                        maxLength: 200
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 99999
                      unitPrice:
                        type: number
                        minimum: 0
                        maximum: 99999999
                    required:
                      - description
                      - quantity
                      - unitPrice
                note:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Added to the job timeline (not shown to the customer)
              required:
                - lines
                - note
      responses:
        "200":
          description: "added: false when the job was finished or invoiced"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      added:
                        type: boolean
                    required:
                      - added
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or wrong X-Internal-Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/job-cards/{id}/owner-link:
    get:
      operationId: getJobOwnerLink
      tags:
        - job-cards
      summary: Whether the job's car belongs to a Kaduna member
      description: A member who registered the plate follows the job in their own dashboard. registered is null when it cannot be checked. Owner and mechanics.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The plate and whether a member registered it
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      plate:
                        type:
                          - string
                          - "null"
                      registered:
                        type:
                          - boolean
                          - "null"
                    required:
                      - plate
                      - registered
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not linked to a garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your garage first, or the record is not in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/reports:
    get:
      operationId: getReport
      tags:
        - reports
      summary: Business report for a date range
      description: Garage owner only.
      parameters:
        - name: from
          in: query
          schema:
            description: First day, garage time. Defaults to 29 days before `to`
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: to
          in: query
          schema:
            description: Last day, garage time. Defaults to today
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
      responses:
        "200":
          description: The report
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Report"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not linked to a garage, or a mechanic calling an owner-only operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your garage first, or the record is not in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Shared secret between Kaduna services (INTERNAL_API_TOKEN); /internal is not reachable from outside
  schemas:
    Garage:
      type: object
      properties:
        id:
          type: string
        providerId:
          type: string
        name:
          type: string
        phone:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        labourRate: *a4
        taxRate:
          type: number
          description: Percent, 0-100
        currency:
          type: string
          example: LKR
        email:
          type:
            - string
            - "null"
        registrationNo:
          type:
            - string
            - "null"
        logoUrl:
          type:
            - string
            - "null"
          description: data:image URL or https URL
        brandColor:
          type:
            - string
            - "null"
          example: "#ff6a13"
        invoiceTerms:
          type:
            - string
            - "null"
        invoiceFooter:
          type:
            - string
            - "null"
        bankDetails:
          type:
            - string
            - "null"
        createdAt: *a1
      required:
        - id
        - providerId
        - name
        - phone
        - address
        - labourRate
        - taxRate
        - currency
        - email
        - registrationNo
        - logoUrl
        - brandColor
        - invoiceTerms
        - invoiceFooter
        - bankDetails
        - createdAt
    Customer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        notes:
          type:
            - string
            - "null"
        createdAt: *a1
      required:
        - id
        - name
        - phone
        - email
        - notes
        - createdAt
    Vehicle:
      type: object
      properties:
        id:
          type: string
        customerId:
          type:
            - string
            - "null"
        plate:
          type:
            - string
            - "null"
          description: "Normalised: upper case, letters and digits split by a dash. Null when not known yet."
          example: CAB-1234
        make:
          type:
            - string
            - "null"
        model:
          type:
            - string
            - "null"
        year:
          type:
            - integer
            - "null"
        odometerKm:
          type:
            - integer
            - "null"
        notes:
          type:
            - string
            - "null"
        createdAt: *a1
      required:
        - id
        - customerId
        - plate
        - make
        - model
        - year
        - odometerKm
        - notes
        - createdAt
    Part:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        brand:
          type:
            - string
            - "null"
        unitCost: *a4
        unitPrice: *a4
        stockQty:
          type: number
        reorderLevel:
          type: number
        active:
          type: boolean
        lowStock:
          type: boolean
          description: Active and at or below the reorder level
        supplierId:
          type:
            - string
            - "null"
        kind:
          enum:
            - PART
            - CONSUMABLE
          description: A consumable is bulk workshop supply used without a job
        category:
          type:
            - string
            - "null"
        barcode:
          type:
            - string
            - "null"
        locationId:
          type:
            - string
            - "null"
      required:
        - id
        - sku
        - name
        - brand
        - unitCost
        - unitPrice
        - stockQty
        - reorderLevel
        - active
        - lowStock
        - supplierId
        - kind
        - category
        - barcode
        - locationId
    StockMovement:
      type: object
      properties:
        id:
          type: string
        partId:
          type: string
        quantityChange:
          type: number
          description: Positive into stock, negative out
        reason:
          enum:
            - PURCHASE
            - JOB_USE
            - RETURN
            - ADJUSTMENT
            - WORKSHOP_USE
            - COUNT
        jobCardId:
          type:
            - string
            - "null"
        supplierId:
          type:
            - string
            - "null"
        unitCost:
          type:
            - number
            - "null"
          description: Cost per unit for purchases and job use
        note:
          type:
            - string
            - "null"
        createdAt: *a1
      required:
        - id
        - partId
        - quantityChange
        - reason
        - jobCardId
        - supplierId
        - unitCost
        - note
        - createdAt
    JobItem:
      type: object
      properties:
        id:
          type: string
        kind:
          enum:
            - LABOUR
            - PART
        description:
          type: string
        quantity:
          type: number
        unitPrice: *a4
        partId:
          type:
            - string
            - "null"
        lineTotal: *a4
      required:
        - id
        - kind
        - description
        - quantity
        - unitPrice
        - partId
        - lineTotal
    JobCardSummary:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
          description: Per garage, starting at 1, no gaps
        status:
          enum:
            - OPEN
            - IN_PROGRESS
            - WAITING_PARTS
            - READY
            - CLOSED
            - CANCELLED
        source:
          enum:
            - WALK_IN
            - KADUNA_DISPATCH
        customer:
          oneOf:
            - $ref: "#/components/schemas/Customer"
            - type: "null"
        vehicle:
          oneOf:
            - $ref: "#/components/schemas/Vehicle"
            - type: "null"
        mechanic:
          oneOf:
            - $ref: "#/components/schemas/MechanicRef"
            - type: "null"
        complaint:
          type:
            - string
            - "null"
        promisedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt: *a1
        updatedAt: *a1
      required:
        - id
        - number
        - status
        - source
        - customer
        - vehicle
        - mechanic
        - complaint
        - promisedAt
        - createdAt
        - updatedAt
    JobCard:
      allOf:
        - $ref: "#/components/schemas/JobCardSummary"
        - type: object
          properties:
            dispatchIncidentId:
              type:
                - string
                - "null"
            diagnosis:
              type:
                - string
                - "null"
            odometerIn:
              type:
                - integer
                - "null"
            assignedTo:
              type:
                - string
                - "null"
              description: Legacy free-text name; see mechanic
            closedAt:
              type:
                - string
                - "null"
              format: date-time
            trackingToken:
              type: string
              description: Key for the customer tracking link /track?t=…
            items:
              type: array
              items:
                $ref: "#/components/schemas/JobItem"
            subtotal: *a4
            invoice:
              description: The current (not voided) invoice, if any
              oneOf:
                - type: object
                  properties:
                    id:
                      type: string
                    number:
                      type: integer
                    status:
                      enum:
                        - UNPAID
                        - PAID
                    total: *a4
                  required:
                    - id
                    - number
                    - status
                    - total
                - type: "null"
            updates:
              type: array
              description: Timeline, newest first (up to 100)
              items:
                $ref: "#/components/schemas/JobUpdate"
            inspection:
              oneOf:
                - type: object
                  properties:
                    id:
                      type: string
                    status:
                      enum:
                        - DRAFT
                        - SENT
                    checked:
                      type: integer
                    total:
                      type: integer
                    attention:
                      type: integer
                      description: Items needing attention or urgent
                    pendingApproval:
                      type: integer
                  required:
                    - id
                    - status
                    - checked
                    - total
                    - attention
                    - pendingApproval
                - type: "null"
          required:
            - dispatchIncidentId
            - diagnosis
            - odometerIn
            - assignedTo
            - closedAt
            - trackingToken
            - items
            - subtotal
            - invoice
            - updates
            - inspection
    Invoice:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        jobCardId:
          type: string
        jobNumber:
          type:
            - integer
            - "null"
        status:
          enum:
            - UNPAID
            - PAID
            - VOID
        lines:
          type: array
          description: Snapshot of the job lines when the invoice was issued
          items:
            type: object
            properties:
              kind:
                enum:
                  - LABOUR
                  - PART
              description:
                type: string
              quantity:
                type: number
              unitPrice: *a4
              lineTotal: *a4
            required:
              - kind
              - description
              - quantity
              - unitPrice
              - lineTotal
        subtotal: *a4
        tax: *a4
        total: *a4
        paymentMethod:
          oneOf:
            - enum:
                - CASH
                - CARD
                - BANK_TRANSFER
                - OTHER
            - type: "null"
        issuedAt: *a1
        paidAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - number
        - jobCardId
        - jobNumber
        - status
        - lines
        - subtotal
        - tax
        - total
        - paymentMethod
        - issuedAt
        - paidAt
    Dashboard:
      type: object
      properties:
        jobsByStatus:
          type: object
          additionalProperties:
            type: integer
        openJobs:
          type: integer
          description: Jobs not CLOSED or CANCELLED
        jobsDueToday:
          type: integer
          description: Open jobs promised for today (Sri Lanka time)
        revenueThisMonth:
          type: number
          description: Paid invoices this calendar month
        unpaidTotal: *a4
        lowStockParts:
          type: array
          items:
            $ref: "#/components/schemas/Part"
      required:
        - jobsByStatus
        - openJobs
        - jobsDueToday
        - revenueThisMonth
        - unpaidTotal
        - lowStockParts
    MechanicRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
    JobUpdate:
      type: object
      properties:
        id:
          type: string
        status:
          oneOf:
            - enum:
                - OPEN
                - IN_PROGRESS
                - WAITING_PARTS
                - READY
                - CLOSED
                - CANCELLED
            - type: "null"
        note:
          type:
            - string
            - "null"
        author:
          type:
            - string
            - "null"
          description: Mechanic's name, 'Customer', or null for the workshop
        public:
          type: boolean
          description: Shown on the tracking link
        createdAt: *a1
      required:
        - id
        - status
        - note
        - author
        - public
        - createdAt
    StaffMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type:
            - string
            - "null"
        active:
          type: boolean
        joined:
          type: boolean
          description: A Kaduna account has joined with the invite code
        joinedAt:
          type:
            - string
            - "null"
          format: date-time
        inviteCode:
          type:
            - string
            - "null"
          description: Shown to the owner until the mechanic joins
        createdAt: *a1
      required:
        - id
        - name
        - phone
        - active
        - joined
        - joinedAt
        - inviteCode
        - createdAt
    Me:
      type: object
      properties:
        role:
          oneOf:
            - enum:
                - OWNER
                - MECHANIC
            - type: "null"
        garage:
          oneOf:
            - $ref: "#/components/schemas/Garage"
            - type: "null"
        staff:
          oneOf:
            - $ref: "#/components/schemas/StaffMember"
            - type: "null"
      required:
        - role
        - garage
        - staff
    InspectionItem:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        name:
          type: string
        result:
          enum:
            - NOT_CHECKED
            - OK
            - ATTENTION
            - URGENT
        note:
          type:
            - string
            - "null"
        estimate:
          type:
            - number
            - "null"
          description: Price of the recommended work
        approval:
          oneOf:
            - enum:
                - PENDING
                - APPROVED
                - DECLINED
            - type: "null"
          description: "null: nothing for the customer to decide"
        decidedAt:
          type:
            - string
            - "null"
          format: date-time
        jobItemId:
          type:
            - string
            - "null"
          description: Set once added to the job
        sortOrder:
          type: integer
      required:
        - id
        - category
        - name
        - result
        - note
        - estimate
        - approval
        - decidedAt
        - jobItemId
        - sortOrder
    Inspection:
      type: object
      properties:
        id:
          type: string
        jobCardId:
          type: string
        status:
          enum:
            - DRAFT
            - SENT
        summary:
          type:
            - string
            - "null"
        sentAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt: *a1
        updatedAt: *a1
        items:
          type: array
          items:
            $ref: "#/components/schemas/InspectionItem"
      required:
        - id
        - jobCardId
        - status
        - summary
        - sentAt
        - createdAt
        - updatedAt
        - items
    InspectionBoardRow:
      type: object
      properties:
