    BookingSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: "Off: the booking link shows that online booking is closed"
        listed:
          default: true
          description: While booking is on, the garage is also listed on kaduna.lk and in the Kaduna dashboards of drivers
          type: boolean
        slotMinutes:
          default: 60
          description: Length of each bookable slot
          type: integer
          minimum: 15
          maximum: 240
        capacity:
          default: 1
          description: Cars that can be booked into the same slot (bays)
          type: integer
          minimum: 1
          maximum: 20
        leadHours:
          default: 2
          description: Minimum notice before a slot
          type: integer
          minimum: 0
          maximum: 168
        daysAhead:
          default: 14
          description: How far ahead customers can book
          type: integer
          minimum: 1
          maximum: 90
        hours:
          type: object
          properties:
            mon:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
            tue:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
            wed:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
            thu:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
            fri:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
            sat:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
            sun:
              anyOf:
                - type: object
                  properties:
                    open:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                    close:
                      type: string
                      pattern: ^([01]\d|2[0-3]):[0-5]\d$
                  required:
                    - open
                    - close
                - type: "null"
              description: "null: closed that day"
          required:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
        services:
          default: []
          description: Offered as choices; empty lets customers describe the job
          maxItems: 20
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 80
        note:
          description: Shown to customers on the booking page
          anyOf:
            - type: string
              maxLength: 500
            - type: "null"
      required:
        - enabled
        - hours
