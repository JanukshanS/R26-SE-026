# Generated by components/garage-management (npm run openapi). Do not edit by hand.
openapi: 3.1.0
info:
  title: Kaduna.lk — Garage Management Service
  version: 1.0.0
  description: "A workshop system for Kaduna service providers: customers and vehicles, appointments, job cards, digital inspections, parts stock and suppliers, mechanics, invoices and reports, plus customer tracking links and what vehicle owners see. Parts shops are a separate service (parts-management). Every /api/v1 route except /api/v1/public needs a Supabase bearer token. The provider who owns a garage is its OWNER; mechanics join with an invite code and act as MECHANIC, with no access to money, settings or staff. Each garage sees only its own records. Generated from src/openapi.ts (request shapes come from the zod validators); do not edit by hand."
servers:
  - url: https://garage.kaduna.lk
    description: Production
  - url: http://localhost:3002
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: garage
    description: "The provider's workshop: name, contact, labour and tax rates"
  - name: dashboard
    description: Counts and totals for the home screen
  - name: customers
    description: People who bring vehicles in
  - name: vehicles
    description: Vehicles serviced, by plate
  - name: inventory
    description: Parts and their stock history
  - name: job-cards
    description: Work orders, from walk-ins or Kaduna dispatch jobs
  - name: invoices
    description: Invoices issued from job cards, and payments
  - name: inspections
    description: Digital vehicle inspections the customer approves
  - name: appointments
    description: Bookings, and checking customers in
  - name: staff
    description: Mechanics and how they join
  - name: suppliers
    description: Where parts come from, and spend
  - name: calls
    description: Customers calling garages through Kaduna
  - name: admin
    description: Platform figures for Kaduna administrators
  - name: stock
    description: Shelves and bays, stocktakes, and purchase orders with goods-in
  - name: assets
    description: Tools and equipment register, and customers' parts the garage is holding
  - name: internal
    description: "For other Kaduna services (the parts service): mechanics, jobs and received parts"
  - name: owners
    description: "Vehicle owners: their cars at any garage, and booking a garage from the Kaduna dashboard"
  - name: reports
    description: Revenue, jobs, mechanics and inspections over a date range
  - name: tracking
    description: What customers and drivers see
  - name: booking
    description: Customers booking a slot through the garage's link
  - name: health
    description: Liveness
paths:
  /health:
    get:
      operationId: health
      tags:
        - health
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      service:
                        const: garage-management
                      status:
                        const: healthy
                      database:
                        const: connected
                    required:
                      - service
                      - status
                      - database
                  timestamp: &a1
                    type: string
                    format: date-time
                required:
                  - success
                  - data
                  - timestamp
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/track/{token}:
    get:
      operationId: getTracking
      tags:
        - tracking
      summary: A customer's view of their job
      description: Status, timeline, work and prices, and the inspection report once sent. The token is the only key; resetting it revokes the link.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Tracking"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/track/{token}/inspection/items/{itemId}:
    post:
      operationId: decideInspectionItem
      tags:
        - tracking
      summary: Approve or decline recommended work
      description: The customer can change their mind until the workshop adds the work to the job.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - APPROVED
                    - DECLINED
              required:
                - decision
      responses:
        "200":
          description: The job, updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Tracking"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, stock too low, duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/garages:
    get:
      operationId: listPublicGarages
      tags:
        - booking
      summary: Public garage directory
      description: Garages taking online bookings that chose to be listed (booking setting `listed`), for kaduna.lk. Contact details and the booking link only.
      security: []
      parameters:
        - name: q
          in: query
          schema:
            description: Garage name or address
            type: string
            maxLength: 100
      responses:
        "200":
          description: By name
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DirectoryGarage"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/book/{token}:
    get:
      operationId: getBookingPage
      tags:
        - booking
      summary: A garage's booking page
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The garage and its booking rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/BookingPage"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: bookOnline
      tags:
        - booking
      summary: Book a slot
      description: The slot is re-checked under a per-garage lock, so the last place in a slot goes to one customer only. Limited to 20 bookings per hour per address, and 3 upcoming online bookings per phone number.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startsAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                  description: Must be one of the slots offered
                service:
                  type: string
                  minLength: 1
                  maxLength: 160
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                phone:
                  type: string
                  minLength: 7
                  maxLength: 40
                plate:
                  anyOf:
                    - type: string
                      maxLength: 20
                    - type: "null"
                vehicle:
                  description: Make and model, e.g. Toyota Aqua
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: "null"
                notes:
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: "null"
                website:
                  description: Leave empty (spam trap)
                  type: string
                  maxLength: 0
              required:
                - startsAt
                - service
                - name
                - phone
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: For /book?a=… to view or cancel
                      booking:
                        $ref: "#/components/schemas/PublicBooking"
                    required:
                      - token
                      - booking
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, stock too low, duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/book/{token}/slots:
    get:
      operationId: listFreeSlots
      tags:
        - booking
      summary: Free slots
      description: Opening hours cut into slots, in garage time, minus live appointments, notice period and anything beyond the booking window. Empty while booking is off.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          schema:
            description: First day, garage time; defaults to today
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: days
          in: query
          schema:
            default: 7
            type: integer
            minimum: 1
            maximum: 14
      responses:
        "200":
          description: One entry per day
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DaySlots"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/bookings/{token}:
    get:
      operationId: getPublicBooking
      tags:
        - booking
      summary: A customer's booking
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PublicBooking"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/public/bookings/{token}/cancel:
    post:
      operationId: cancelPublicBooking
      tags:
        - booking
      summary: Cancel a booking
      description: Only before it starts and before check-in.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/PublicBooking"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, stock too low, duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/booking-settings:
    get:
      operationId: getBookingSettings
      tags:
        - booking
      summary: Online booking rules and link
      description: Garage owner only.
      responses:
        "200":
          description: The settings (defaults until saved)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/BookingConfig"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not linked to a garage, or a mechanic calling an owner-only operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your garage first, or the record is not in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveBookingSettings
      tags:
        - booking
      summary: Save online booking rules
      description: The first save also creates the booking link. Garage owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                  description: "Off: the booking link shows that online booking is closed"
                listed:
                  default: true
                  description: While booking is on, the garage is also listed on kaduna.lk and in the Kaduna dashboards of drivers
                  type: boolean
                slotMinutes:
                  default: 60
                  description: Length of each bookable slot
                  type: integer
                  minimum: 15
                  maximum: 240
                capacity:
                  default: 1
                  description: Cars that can be booked into the same slot (bays)
                  type: integer
                  minimum: 1
                  maximum: 20
                leadHours:
                  default: 2
                  description: Minimum notice before a slot
                  type: integer
                  minimum: 0
                  maximum: 168
                daysAhead:
                  default: 14
                  description: How far ahead customers can book
                  type: integer
                  minimum: 1
                  maximum: 90
                hours:
                  type: object
                  properties:
                    mon:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                    tue:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                    wed:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                    thu:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                    fri:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                    sat:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                    sun:
                      anyOf:
                        - type: object
                          properties:
                            open:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                            close:
                              type: string
                              pattern: ^([01]\d|2[0-3]):[0-5]\d$
                          required:
                            - open
                            - close
                        - type: "null"
                      description: "null: closed that day"
                  required:
                    - mon
                    - tue
                    - wed
                    - thu
                    - fri
                    - sat
                    - sun
                services:
                  default: []
                  description: Offered as choices; empty lets customers describe the job
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 80
                note:
                  description: Shown to customers on the booking page
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
              required:
                - enabled
                - hours
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/BookingConfig"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not linked to a garage, or a mechanic calling an owner-only operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your garage first, or the record is not in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/booking-settings/reset-link:
    post:
      operationId: resetBookingLink
      tags:
        - booking
      summary: New booking link (the old one stops working)
      description: Garage owner only.
      responses:
        "200":
          description: With the new link
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/BookingConfig"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not linked to a garage, or a mechanic calling an owner-only operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your garage first, or the record is not in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/me:
    get:
      operationId: getMe
      tags:
        - garage
      summary: Who the caller is to the garage service
      description: OWNER (garage is null before setup), MECHANIC with their garage, or role null for an account linked to neither.
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Me"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/repairs:
    get:
      operationId: listRepairs
      tags:
        - tracking
      summary: Repair status for Kaduna dispatch jobs
      description: "For the driver app: the garage and status of job cards opened from these incidents. Status only; prices and approvals are on the tracking link."
      parameters:
        - name: incidentIds
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 3200
            description: Comma-separated Kaduna incident ids, up to 50
      responses:
        "200":
          description: One entry per incident that has a job card
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Repair"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/staff/join:
    post:
      operationId: joinGarage
      tags:
        - staff
      summary: Join a garage as a mechanic
      description: Links the signed-in account to the garage that issued the invite code. A code works once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 12
                  description: The invite code the garage owner gave you
              required:
                - code
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Me"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found in this garage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, stock too low, duplicate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/garage:
    get:
      operationId: getGarage
      tags:
        - garage
      summary: The caller's garage
      responses:
        "200":
          description: The garage, or null before setup
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/Garage"
                      - type: "null"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed (for example, a dispatch job assigned to another provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: saveGarage
      tags:
        - garage
      summary: Set up or update the garage
      description: Creates the garage on first call (201), updates it after (200). One garage per provider. Branding fields left out keep their saved values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                phone:
                  anyOf:
                    - type: string
                      maxLength: 40
                    - type: "null"
                address:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                labourRate:
                  default: 0
                  description: Default hourly labour charge, used when a labour line has no price.
                  type: number
                  minimum: 0
                  maximum: 99999999
                taxRate:
                  default: 0
                  description: Percentage added to invoices.
                  type: number
                  minimum: 0
                  maximum: 100
                email:
                  anyOf:
                    - type: string
                      maxLength: 200
                      format: email
                      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    - type: "null"
                registrationNo:
                  description: Business registration or VAT number, printed on invoices
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                logoUrl:
                  description: A small data:image URL (under ~200 KB) or an https URL
                  anyOf:
                    - type: string
                      maxLength: 300000
                    - type: "null"
                brandColor:
                  anyOf:
                    - type: string
                      pattern: ^#[0-9a-fA-F]{6}$
                    - type: "null"
                invoiceTerms:
                  description: Payment terms, for example "Due on collection"
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: "null"
                invoiceFooter:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                bankDetails:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
              required:
                - name
      responses:
        "200":
          description: Updated (201 when created)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Garage"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not allowed (for example, a dispatch job assigned to another provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
