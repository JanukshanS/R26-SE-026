                              required:
                                - note
                                - part
                          movements:
                            type: array
                            items:
                              $ref: "#/components/schemas/StockMovement"
                        required:
                          - onOrder
                          - files
                          - substitutes
                          - movements
                  timestamp: *a1
                required:
                  - success
