  /api/v1/shop/sales/{id}/exchange:
    post:
      operationId: exchangeSale
      tags:
        - sales
      summary: Exchange items from a sale
      description: What comes back pays for the new items (as store credit). A difference due needs payments or paymentMethod (DIFFERENCE_DUE); a leftover stays as store credit, or is refunded with balanceTo (a manager). Return rules apply (RETURN_RULE). The shop the caller works at. Owner, managers and cashiers. Refunding a leftover in money, or overriding a return rule, needs a manager.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnItems:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      saleItemId:
                        type: string
                        minLength: 1
                        maxLength: 64
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 99999
                      restock:
                        default: true
                        description: "false: damaged, not back on the shelf"
                        type: boolean
                    required:
                      - saleItemId
                      - quantity
                  description: What comes back from this sale
                items:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      partId:
                        description: "A stocked part: takes its name, price and VAT rate, and reduces stock"
                        anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 64
                          - type: "null"
                      description:
                        description: Required without partId
                        anyOf:
                          - type: string
                            maxLength: 200
                          - type: "null"
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 99999
                      unitPrice:
                        description: Override the price for this sale
                        type: number
                        minimum: 0
                        maximum: 99999999
                      discount:
                        default: 0
                        description: Off this line (an amount)
                        type: number
                        minimum: 0
                        maximum: 99999999
                      taxRate:
                        description: "Without partId: VAT percent (default the shop's rate)"
                        type: number
                        minimum: 0
                        maximum: 100
                      serialNumbers:
                        description: "Serialized parts: one per unit"
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 80
                      coreReturned:
                        default: false
                        description: "The customer handed the old unit in: no core deposit"
                        type: boolean
                      locationId:
                        description: Take it from here; otherwise the part's default location first
                        anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 64
                          - type: "null"
                    required:
                      - quantity
                  description: What the customer takes instead
                discount:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 99999999
                payments:
                  description: For a difference to pay
                  maxItems: 5
                  type: array
                  items:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                          - CASH
                          - CARD
                          - BANK_TRANSFER
                          - OTHER
                          - ACCOUNT
                          - VOUCHER
                      amount:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 99999999
                      reference:
                        anyOf:
                          - type: string
                            maxLength: 80
                          - type: "null"
                    required:
                      - method
                      - amount
                paymentMethod:
                  description: Shorthand for one payment of the difference
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - BANK_TRANSFER
                    - OTHER
                    - ACCOUNT
                    - VOUCHER
                tendered:
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 99999999
                    - type: "null"
                balanceTo:
                  default: VOUCHER
                  description: "If what came back is worth more: refund the rest this way (VOUCHER: store credit)"
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - BANK_TRANSFER
                    - OTHER
                    - ACCOUNT
                    - VOUCHER
                reason:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                override:
                  default: false
                  description: Take it back even though the shop's return rules say no (owner or manager)
                  type: boolean
                waiveFee:
                  default: false
                  description: Skip the restocking fee (owner or manager)
                  type: boolean
                approvalPin:
                  description: A manager's PIN, when the caller's role can't do this on their own
                  anyOf:
                    - type: string
                      pattern: ^\d{4,6}$
                    - type: "null"
              required:
                - returnItems
                - items
      responses:
        "201":
          description: Both sales, and any store credit left
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    type: object
                    properties:
                      original:
                        $ref: "#/components/schemas/Sale"
                      sale:
                        $ref: "#/components/schemas/Sale"
                      credit:
                        oneOf:
                          - $ref: "#/components/schemas/StoreCredit"
                          - type: "null"
                      returned: *a4
                      due:
                        type: number
                        description: Paid on top
                      refunded:
                        type: number
                        description: Paid out of what came back
                    required:
                      - original
                      - sale
                      - credit
                      - returned
                      - due
                      - refunded
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not allowed: the caller's role can't (FORBIDDEN), a manager's PIN is needed (APPROVAL_REQUIRED), a wrong handover code, or an invalid or expired file link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your parts shop first, or not found in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, not enough stock, not on your sellers)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
