components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token
  schemas:
    Shop:
      type: object
      properties:
        id: *a2
        name: *a2
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        registrationNo:
          type:
            - string
            - "null"
        openingHours:
          type:
            - string
            - "null"
        delivers: *a6
        deliveryNote:
          type:
            - string
            - "null"
        currency: *a2
        taxRate:
          type: number
          description: Percent
        receiptFooter:
          type:
            - string
            - "null"
        vatNumber:
          type:
            - string
            - "null"
        receiptWidth:
          enum:
            - 58mm
            - 80mm
            - A4
        maxDiscountPct:
          type: number
          description: Deeper discounts need a manager
        requireCashSession: *a6
        active: *a6
        createdAt: *a1
      required:
        - id
        - name
        - phone
        - email
        - address
        - city
        - registrationNo
        - openingHours
        - delivers
        - deliveryNote
        - currency
        - taxRate
        - receiptFooter
        - vatNumber
        - receiptWidth
        - maxDiscountPct
        - requireCashSession
        - active
        - createdAt
    PublicShop:
      type: object
      properties:
        id: *a2
        name: *a2
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        city:
          type:
            - string
            - "null"
        openingHours:
          type:
            - string
            - "null"
        delivers: *a6
        deliveryNote:
          type:
            - string
            - "null"
        currency: *a2
      required:
        - id
        - name
        - phone
        - email
        - address
        - city
        - openingHours
        - delivers
        - deliveryNote
        - currency
    Fitment:
      type: object
      properties:
        id: *a2
        make: *a2
        model: *a2
        yearFrom:
          type:
            - integer
            - "null"
        yearTo:
          type:
            - integer
            - "null"
        note:
          type:
            - string
            - "null"
      required:
        - id
        - make
        - model
        - yearFrom
        - yearTo
        - note
    Part:
      type: object
      properties:
        id: *a2
        sku: *a2
        name: *a2
        description:
          type:
            - string
            - "null"
        brand:
          type:
            - string
            - "null"
        category:
          type:
            - string
            - "null"
        oemNumber:
          type:
            - string
            - "null"
        partNumber:
          type:
            - string
            - "null"
        crossRefs:
          type: array
          items: *a2
        barcode:
          type:
            - string
            - "null"
        location:
          type:
            - string
            - "null"
          description: The default location's name
        defaultLocationId: *a2
        tags:
          type: array
          items: *a2
        specs:
          type: array
          items:
            type: object
            properties:
              name: *a2
              value: *a2
            required:
              - name
              - value
        unit: *a2
        costPrice:
          type:
            - number
            - "null"
          description: null when the caller's role doesn't see costs
        retailPrice: *a4
        tradePrice:
          type:
            - number
            - "null"
          description: "null: garages pay the retail price"
        taxRate:
          type:
            - number
            - "null"
          description: "VAT percent; null: the shop's rate"
        warrantyMonths:
          type:
            - integer
            - "null"
        coreCharge:
          type:
            - number
            - "null"
          description: Refundable deposit until the old unit comes back
        serialized: *a6
        fractional:
          type: boolean
          description: "Sold by measure: any quantity"
        quickQtys:
          type: array
          items: *a5
        purchaseUnit:
          type:
            - string
            - "null"
        purchaseFactor:
          type: number
          description: Selling units per purchase unit
        breaksInto:
          oneOf:
            - type: object
              properties:
                id: *a2
                name:
                  type:
                    - string
                    - "null"
                unit:
                  type:
                    - string
                    - "null"
                stockQty:
                  type:
                    - number
                    - "null"
                qty:
                  type:
                    - number
                    - "null"
              required:
                - id
                - name
                - unit
                - stockQty
                - qty
            - type: "null"
        openedFrom:
          type: array
          items:
            type: object
            properties:
              id: *a2
