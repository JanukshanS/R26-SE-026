    post:
      operationId: createSale
      tags:
        - sales
      summary: Ring up a sale
      description: Stock out for stocked lines; VAT per line at the part's rate after discounts. Payments must add up to the total; ACCOUNT charges the account within its credit. A discount past the shop's limit needs a manager (APPROVAL_REQUIRED without one). The shop the caller works at. Owner, managers and cashiers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  minItems: 1
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      partId:
                        description: "A stocked part: takes its name, price and VAT rate, and reduces stock"
                        anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 64
                          - type: "null"
                      description:
                        description: Required without partId
                        anyOf:
                          - type: string
                            maxLength: 200
                          - type: "null"
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 99999
                      unitPrice:
                        description: Override the price for this sale
                        type: number
                        minimum: 0
                        maximum: 99999999
                      discount:
                        default: 0
                        description: Off this line (an amount)
                        type: number
                        minimum: 0
                        maximum: 99999999
                      taxRate:
                        description: "Without partId: VAT percent (default the shop's rate)"
                        type: number
                        minimum: 0
                        maximum: 100
                      serialNumbers:
                        description: "Serialized parts: one per unit"
                        maxItems: 100
                        type: array
                        items:
                          type: string
                          minLength: 1
                          maxLength: 80
                      coreReturned:
                        default: false
                        description: "The customer handed the old unit in: no core deposit"
                        type: boolean
                      locationId:
                        description: Take it from here; otherwise the part's default location first
                        anyOf:
                          - type: string
                            minLength: 1
                            maxLength: 64
                          - type: "null"
                    required:
                      - quantity
                discount:
                  default: 0
                  description: Off the whole sale, after line discounts
                  type: number
                  minimum: 0
                  maximum: 99999999
                payments:
                  description: How it was paid; must add up to the total. Or give paymentMethod for one payment of the total
                  minItems: 1
                  maxItems: 5
                  type: array
                  items:
                    type: object
                    properties:
                      method:
                        type: string
                        enum:
                          - CASH
                          - CARD
                          - BANK_TRANSFER
                          - OTHER
                          - ACCOUNT
                          - VOUCHER
                      amount:
                        type: number
                        exclusiveMinimum: 0
                        maximum: 99999999
                      reference:
                        description: Card slip or transfer number
                        anyOf:
                          - type: string
                            maxLength: 80
                          - type: "null"
                    required:
                      - method
                      - amount
                paymentMethod:
                  description: Shorthand for one payment of the whole total
                  type: string
                  enum:
                    - CASH
                    - CARD
                    - BANK_TRANSFER
                    - OTHER
                    - ACCOUNT
                    - VOUCHER
                tendered:
                  description: Cash handed over, for the change
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 99999999
                    - type: "null"
                accountId:
                  description: "ACCOUNT payments: the trade or customer account to charge"
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
                taxInvoice:
                  default: false
                  description: Issue a VAT tax invoice (needs the shop VAT number and the buyer name)
                  type: boolean
                customerName:
                  anyOf:
                    - type: string
                      maxLength: 160
                    - type: "null"
                customerPhone:
                  anyOf:
                    - type: string
                      maxLength: 40
                    - type: "null"
                customerAddress:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                customerVatNo:
                  anyOf:
                    - type: string
                      maxLength: 40
                    - type: "null"
                plate:
                  anyOf:
                    - type: string
                      maxLength: 20
                    - type: "null"
                note:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                draftId:
                  description: Completes this held sale or quote
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
                approvalPin:
                  description: A manager's PIN, when the caller's role can't do this on their own
                  anyOf:
                    - type: string
                      pattern: ^\d{4,6}$
                    - type: "null"
              required:
                - items
      responses:
        "201":
          description: The sale (receipt)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data:
                    $ref: "#/components/schemas/Sale"
                  timestamp: *a1
                required:
                  - success
                  - data
                  - timestamp
        "401":
          description: Missing or invalid Supabase token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Not allowed: the caller's role can't (FORBIDDEN), a manager's PIN is needed (APPROVAL_REQUIRED), a wrong handover code, or an invalid or expired file link"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Set up your parts shop first, or not found in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicts with the current state (wrong status, not enough stock, not on your sellers)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
