            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; `details` lists each field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createPart
      tags:
        - inventory
      summary: Add a part
      description: Opening stock is recorded as an OPENING movement. The shop the caller works at. Owner, managers and storekeepers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: The shop's own code, unique in the shop
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                description:
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: "null"
                brand:
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                category:
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                oemNumber:
                  description: The carmaker's part number
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                partNumber:
                  description: The part maker's number
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                crossRefs:
                  description: Other numbers this part is known by
                  maxItems: 30
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 80
                barcode:
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                location:
                  description: Default location by name, e.g. A3-02 (made if new). Or give defaultLocationId
                  anyOf:
                    - type: string
                      maxLength: 60
                    - type: "null"
                defaultLocationId:
                  description: Where new stock goes and the counter takes from first
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
                tags:
                  description: Free labels; stored lower case
                  maxItems: 20
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 40
                specs:
                  description: 'Specifications, e.g. [{ "name": "Voltage", "value": "12 V" }]'
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 60
                        description: e.g. "Thread size"
                      value:
                        type: string
                        minLength: 1
                        maxLength: 120
                        description: e.g. "M12 x 1.5"
                    required:
                      - name
                      - value
                unit:
                  type: string
                  minLength: 1
                  maxLength: 20
                costPrice:
                  type: number
                  minimum: 0
                  maximum: 99999999
                retailPrice:
                  type: number
                  minimum: 0
                  maximum: 99999999
                tradePrice:
                  description: "What garages pay; empty: the retail price"
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 99999999
                    - type: "null"
                reorderLevel:
                  type: number
                  minimum: 0
                  maximum: 99999
                reorderQty:
                  type: number
                  minimum: 0
                  maximum: 99999
                universal:
                  description: "Fits any vehicle (oil, bulbs, wipers by size): no fitment filtering"
                  type: boolean
                listed:
                  description: Shown to garages in the online catalogue (default true)
                  type: boolean
                supplierId:
                  description: Usually bought from
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
                notes:
                  anyOf:
                    - type: string
                      maxLength: 1000
                    - type: "null"
                taxRate:
                  description: "VAT percent for this part; empty: the shop's rate, 0: exempt"
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 100
                    - type: "null"
                warrantyMonths:
                  description: Warranty from the day of sale
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 120
                    - type: "null"
                coreCharge:
                  description: Refundable deposit until the old unit is brought back
                  anyOf:
                    - type: number
                      minimum: 0
                      maximum: 99999999
                    - type: "null"
                serialized:
                  description: Ask for each unit serial number at the counter
                  type: boolean
                fractional:
                  description: "Sold by measure (litres, metres): any quantity, not just whole units"
                  type: boolean
                quickQtys:
                  description: Quick amounts at the counter, e.g. [0.5, 1, 4]
                  maxItems: 8
                  type: array
                  items:
                    type: number
                    exclusiveMinimum: 0
                    maximum: 9999
                purchaseUnit:
                  description: Bought in a bigger unit, e.g. "drum", "box"
                  anyOf:
                    - type: string
                      maxLength: 20
                    - type: "null"
                purchaseFactor:
                  description: "Selling units per purchase unit, e.g. 208 litres in a drum (1: the same)"
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100000
                breaksIntoId:
                  description: "A sealed pack: the loose part it opens into"
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 64
                    - type: "null"
                breaksIntoQty:
                  description: How many of the loose part one pack makes, e.g. 4 (litres)
                  anyOf:
                    - type: number
                      exclusiveMinimum: 0
                      maximum: 100000
                    - type: "null"
                warrantyFreeMonths:
                  description: Months of the warranty that are free; after that a replacement is charged pro rata
                  anyOf:
                    - type: integer
                      minimum: 0
                      maximum: 120
                    - type: "null"
                openingStock:
                  default: 0
                  description: Stock on the shelf now, recorded as OPENING
                  type: number
                  minimum: 0
                  maximum: 99999
                fitments:
                  default: []
                  maxItems: 50
                  type: array
                  items:
                    type: object
                    properties:
                      make:
                        type: string
                        minLength: 1
                        maxLength: 60
                      model:
                        type: string
                        minLength: 1
                        maxLength: 80
                      yearFrom:
                        anyOf:
                          - type: integer
                            minimum: 1950
                            maximum: 2100
                          - type: "null"
                      yearTo:
                        anyOf:
                          - type: integer
                            minimum: 1950
                            maximum: 2100
                          - type: "null"
                      note:
                        description: Engine or variant, e.g. "1.5 hybrid"
                        anyOf:
                          - type: string
                            maxLength: 120
                          - type: "null"
                    required:
                      - make
                      - model
              required:
                - sku
                - name
                - retailPrice
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    const: true
                  data: &a8
                    allOf:
                      - $ref: "#/components/schemas/Part"
                      - type: object
                        properties:
                          onOrder:
                            type: number
