    put:
      operationId: saveShop
      tags:
        - shop
      summary: Set up or update your shop
      description: Creates it on first call (201; name required), updates it after. Live at once. One shop per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 160
                  description: Shop name, as garages and customers see it
                phone:
                  anyOf:
                    - type: string
                      maxLength: 40
                    - type: "null"
                email:
                  anyOf:
                    - type: string
                      maxLength: 200
                      format: email
                      pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    - type: "null"
                address:
                  description: Where collectors come to pick parts up
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                city:
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                registrationNo:
                  description: Business registration or VAT number, printed on receipts
                  anyOf:
                    - type: string
                      maxLength: 80
                    - type: "null"
                openingHours:
                  anyOf:
                    - type: string
                      maxLength: 200
                    - type: "null"
                delivers:
                  description: Whether the shop delivers; true when first set up and left out
                  type: boolean
                deliveryNote:
                  description: Areas, fees and times for delivery
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                taxRate:
                  description: Percent added to counter sales; 0 when left out at setup
                  type: number
                  minimum: 0
                  maximum: 100
                receiptFooter:
                  anyOf:
                    - type: string
                      maxLength: 500
                    - type: "null"
                vatNumber:
                  description: VAT registration number; needed for tax invoices
                  anyOf:
                    - type: string
                      maxLength: 40
                    - type: "null"
                receiptWidth:
                  description: "Receipt printer: thermal roll width, or A4"
                  type: string
                  enum:
                    - 58mm
                    - 80mm
                    - A4
                maxDiscountPct:
                  description: Discounts deeper than this need a manager (percent off the list price)
                  type: number
                  minimum: 0
                  maximum: 100
                requireCashSession:
                  description: "true: cash can't be taken without an open cash drawer"
                  type: boolean
                active:
                  description: "false: hidden from garages, no new garage orders"
                  type: boolean
      responses:
