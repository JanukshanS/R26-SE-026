services:
  dispatch:
    build: ./components/dispatch
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DISPATCH_DATABASE_URL:?set DISPATCH_DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      GEO_INTELLIGENCE_URL: http://geo-intelligence:5001
      PREDICTIVE_MAINTENANCE_URL: http://predictive-maintenance:5000
    depends_on:
      geo-intelligence:
        condition: service_healthy

  geo-intelligence:
    build: ./components/geo-intelligence
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}

  predictive-maintenance:
    build: ./components/predictive-maintenance
    restart: unless-stopped
    env_file: .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      # Supabase Postgres, own schema. Was SQLite on a named volume, but because
      # raw OBD/IMU readings are discarded after each trip is summarised, a lost
      # volume meant trip history that could never be reconstructed.
      PREDICTIVE_DATABASE_URL: ${PREDICTIVE_DATABASE_URL:?set PREDICTIVE_DATABASE_URL in .env}

  claims-privacy:
    build: ./components/claims-privacy
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${CLAIMS_DATABASE_URL:?set CLAIMS_DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-kaduna.lk}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dispatch
      - geo-intelligence
      - predictive-maintenance
      - claims-privacy

# Supabase's direct database endpoint (db.<ref>.supabase.co) resolves to IPv6
# only. Compose networks are IPv4-only unless asked otherwise, so without this
# dispatch and claims-privacy cannot reach Postgres even on an IPv6 host.
# Requires "ipv6": true and "ip6tables": true in the daemon's daemon.json.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:beef:cafe::/64

volumes:
  caddy-data:
  caddy-config:
