services:
  dispatch:
    build: ./components/dispatch
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DISPATCH_DATABASE_URL:?set DISPATCH_DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      GEO_INTELLIGENCE_URL: http://geo-intelligence:5001
      PREDICTIVE_MAINTENANCE_URL: http://predictive-maintenance:5000
    depends_on:
      geo-intelligence:
        condition: service_healthy

  geo-intelligence:
    build: ./components/geo-intelligence
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}

  predictive-maintenance:
    build: ./components/predictive-maintenance
    restart: unless-stopped
    env_file: .env
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      # Supabase Postgres, own schema. Was SQLite on a named volume, but because
      # raw OBD/IMU readings are discarded after each trip is summarised, a lost
      # volume meant trip history that could never be reconstructed.
      PREDICTIVE_DATABASE_URL: ${PREDICTIVE_DATABASE_URL:?set PREDICTIVE_DATABASE_URL in .env}

  claims-privacy:
    build: ./components/claims-privacy
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${CLAIMS_DATABASE_URL:?set CLAIMS_DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}

  # Workshop management for service providers. Own Postgres schema (garage);
  # reads incidents from dispatch over the internal network for job imports.
  garage-management:
    build: ./components/garage-management
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: ${GARAGE_DATABASE_URL:?set GARAGE_DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      DISPATCH_URL: http://dispatch:3001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}

  # Spare parts shops: inventory, counter sales, purchasing and garage trade.
  # Own Postgres schema (parts); asks garage-management who a caller is to a
  # garage, and uses its /internal API (shared secret) for jobs and mechanics.
  parts-management:
    build: ./components/parts-management
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: ${PARTS_DATABASE_URL:?set PARTS_DATABASE_URL in .env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      GARAGE_URL: http://garage-management:3002
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in .env}
      # Part photos and documents. Local disk (the volume below) until an S3
      # bucket is set up: then FILES_DRIVER=s3 and the S3_* settings in .env.
      PUBLIC_URL: https://parts.${BASE_DOMAIN:-kaduna.lk}
      FILES_DRIVER: ${FILES_DRIVER:-local}
      FILES_DIR: /data/files
    volumes:
      - parts-files:/data/files
    depends_on:
      - garage-management

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-kaduna.lk}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dispatch
      - geo-intelligence
      - predictive-maintenance
      - claims-privacy
      - garage-management
      - parts-management

# Supabase's direct database endpoint (db.<ref>.supabase.co) resolves to IPv6
# only. Compose networks are IPv4-only unless asked otherwise, so without this
# dispatch and claims-privacy cannot reach Postgres even on an IPv6 host.
# Requires "ipv6": true and "ip6tables": true in the daemon's daemon.json.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:beef:cafe::/64

volumes:
  caddy-data:
  caddy-config:
  parts-files:
