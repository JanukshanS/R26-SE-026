services:
  dispatch:
    build: ./components/dispatch
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DISPATCH_DATABASE_URL:?set DISPATCH_DATABASE_URL in .env}
      GEO_INTELLIGENCE_URL: http://geo-intelligence:5001
      PREDICTIVE_MAINTENANCE_URL: http://predictive-maintenance:5000
    depends_on:
      geo-intelligence:
        condition: service_healthy

  geo-intelligence:
    build: ./components/geo-intelligence
    restart: unless-stopped

  predictive-maintenance:
    build: ./components/predictive-maintenance
    restart: unless-stopped
    environment:
      PREDICTIVE_DATABASE_URL: sqlite:////app/data/predictive.db
    volumes:
      - predictive-data:/app/data

  claims-privacy:
    build: ./components/claims-privacy
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${CLAIMS_DATABASE_URL:?set CLAIMS_DATABASE_URL in .env}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - dispatch
      - geo-intelligence
      - predictive-maintenance
      - claims-privacy

volumes:
  predictive-data:
  caddy-data:
  caddy-config:
